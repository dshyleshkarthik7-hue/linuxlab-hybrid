name: Free-tier content authoring (bounded)

on:
  workflow_dispatch:
    inputs:
      content_type:
        description: Which review-draft queue to generate
        type: choice
        required: true
        options: [commands, tutorials, curriculum]
      start:
        description: Zero-based inventory offset
        type: number
        required: true
        default: 0
      count:
        description: Bounded batch size (commands max 25; tutorials/curriculum max 10)
        type: number
        required: true
        default: 5
      provider:
        description: Free-tier provider strategy
        type: choice
        required: true
        default: auto
        options: [auto, gemini, openrouter]
      command_selection:
        description: For commands only, continue from the first missing draft instead of a fixed catalog offset
        type: choice
        required: true
        default: next-missing
        options: [next-missing, offset]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: free-authoring-${{ github.ref }}-${{ inputs.content_type }}-${{ inputs.start }}
  cancel-in-progress: false

jobs:
  author:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    environment: content-authoring
    steps:
      - name: Checkout trusted main branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: true
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Validate bounded batch inputs
        env:
          CONTENT_TYPE: ${{ inputs.content_type }}
          START: ${{ inputs.start }}
          COUNT: ${{ inputs.count }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const type = process.env.CONTENT_TYPE;
          const start = Number(process.env.START);
          const count = Number(process.env.COUNT);
          const max = type === 'commands' ? 25 : type === 'tutorials' || type === 'curriculum' ? 10 : 0;
          if (!Number.isSafeInteger(start) || start < 0) throw new Error('start must be a non-negative integer');
          if (!Number.isSafeInteger(count) || count < 1 || count > max) throw new Error('count exceeds the selected bounded batch limit');
          NODE
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Install optional similarity audit dependency
        run: python -m pip install -r requirements-curriculum.txt
      - name: Generate free-tier review drafts
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          AI_GENERATOR_PROVIDER_ORDER: ${{ inputs.provider == 'auto' && 'openrouter,gemini' || inputs.provider }}
          AI_VERIFIER_PROVIDER_ORDER: ${{ inputs.provider == 'auto' && 'openrouter,gemini' || inputs.provider }}
          AI_FINAL_PROVIDER_ORDER: ${{ inputs.provider == 'auto' && 'gemini,openrouter' || inputs.provider }}
          START: ${{ inputs.start }}
          COUNT: ${{ inputs.count }}
          CONTENT_TYPE: ${{ inputs.content_type }}
          COMMAND_SELECTION: ${{ inputs.command_selection }}
        run: |
          set -euo pipefail
          case "$CONTENT_TYPE" in
            commands)
              if [[ "$COMMAND_SELECTION" == "next-missing" ]]; then
                node scripts/commands/author-qwen-lessons.mjs --next-missing --count "$COUNT"
              else
                node scripts/commands/author-qwen-lessons.mjs --start "$START" --count "$COUNT"
              fi
              ;;
            tutorials) node scripts/author-qwen-tutorials.mjs --start "$START" --count "$COUNT" ;;
            curriculum) node scripts/author-qwen-curriculum.mjs --start "$START" --count "$COUNT" ;;
            *) echo 'Unsupported content type'; exit 2 ;;
          esac
      - name: Audit draft quality and coverage
        if: always()
        run: python scripts/curriculum-quality-gate.py --report .cache/curriculum-quality-report.json
      - name: Open a review pull request for generated drafts
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          CONTENT_TYPE: ${{ inputs.content_type }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          for path in data/commands/research data/tutorial-research data/curriculum-research; do
            if [[ -d "$path" ]]; then git add -A -- "$path"; fi
          done
          if git diff --cached --quiet; then
            echo "No new review drafts to propose."
            exit 0
          fi
          branch="ai-drafts/${CONTENT_TYPE}-${RUN_ID}"
          git switch -c "$branch"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "content: add ${CONTENT_TYPE} review drafts from run ${RUN_ID}"
          git push origin "HEAD:refs/heads/$branch"
          gh pr create --base main --head "$branch" \
            --title "AI ${CONTENT_TYPE} review drafts (run ${RUN_ID})" \
            --body "## Generated review drafts

          These are unverified AI-assisted drafts created in a bounded batch using the repository's free-tier provider policy.

          - No lesson is published by this PR.
          - Source URLs are candidates, not verified citations.
          - Syntax and examples have not been independently executed.
          - Review the quality report and validate factual accuracy, safety, pedagogy, portability, and source support before merging.
          - Merging this draft-only PR advances the resumable next-missing queue for future batches.

          Generated by GitHub Actions run ${RUN_ID}."
      - name: Upload review drafts and audit report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: free-content-drafts-${{ inputs.content_type }}-${{ inputs.start }}-${{ github.run_id }}
          path: |
            data/commands/research/
            data/tutorial-research/
            data/curriculum-research/
            .cache/curriculum-quality-report.json
          if-no-files-found: warn
          retention-days: 14
