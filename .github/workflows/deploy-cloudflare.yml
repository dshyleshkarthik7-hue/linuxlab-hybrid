name: Deploy Cloudflare ISO Worker
on:
  workflow_dispatch:
    inputs:
      confirm_production_deploy:
        description: 'Deploy the Cloudflare worker to production after preview approval'
        required: true
        default: false
        type: boolean
permissions:
  actions: read
  contents: read
jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.confirm_production_deploy == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Require a successful push CI run for this exact commit
        env:
          GH_TOKEN: ${{ github.token }}
          TESTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          runs_file="$(mktemp)"
          trap 'rm -f "$runs_file"' EXIT
          gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${TESTED_SHA}&per_page=100" > "$runs_file"
          export RUNS_FILE="$runs_file"
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const payload = JSON.parse(readFileSync(process.env.RUNS_FILE, "utf8"));
            const passed = (payload.workflow_runs || []).some((run) =>
              run.head_sha === process.env.TESTED_SHA &&
              run.head_branch === "main" &&
              run.event === "push" &&
              run.status === "completed" &&
              run.conclusion === "success"
            );
            if (!passed) {
              console.error("Refusing production deploy: no successful push-triggered CI run exists for this exact main commit.");
              process.exit(1);
            }
            console.log("Found successful push CI run for", process.env.TESTED_SHA);
          '
      - name: Ensure main has not advanced since CI passed
        env:
          GH_TOKEN: ${{ github.token }}
          TESTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          current_main_sha="$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" refs/heads/main | awk '{print $1}')"
          if [[ "$current_main_sha" != "$TESTED_SHA" ]]; then
            echo "Main advanced from tested CI commit $TESTED_SHA to $current_main_sha; refusing stale production deploy."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Generate and verify Developer Alpine chunk manifest
        run: node scripts/generate-iso-chunk-manifest.mjs
      - name: Assert generated chunk manifest covers the full pinned artifact
        run: |
          node --input-type=module -e '
            import manifest from "./artifacts/manifest.json" with { type: "json" };
            import chunks from "./artifacts/developer-alpine-chunks.json" with { type: "json" };
            const artifact = manifest.artifacts.find(item => item.image === "developer");
            if (!artifact || chunks.artifactSize !== artifact.size || chunks.artifactSha256 !== artifact.sha256 || !Array.isArray(chunks.chunks) || chunks.chunks.length === 0) throw new Error("Developer Alpine chunk manifest is empty or does not match the pinned artifact");
            let next = 0;
            for (const [index, chunk] of chunks.chunks.entries()) {
              if (chunk.index !== index || chunk.start !== next || chunk.end < chunk.start || !/^[a-f0-9]{64}$/.test(chunk.sha256)) throw new Error("Invalid chunk manifest entry " + index);
              next = chunk.end + 1;
            }
            if (next !== artifact.size) throw new Error("Chunk manifest does not cover the complete ISO");
            console.log("Verified", chunks.chunks.length, "contiguous SHA-256 chunks covering", next, "bytes");
          '
      - name: Verify worker contract
        run: npm run test:iso-worker
      - name: Deploy ISO worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.69.0 deploy --config cloudflare/wrangler.jsonc

      - name: Verify Cloudflare worker health
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          headers_file="$(mktemp)"
          curl --fail --silent --show-error --retry 3 --retry-delay 2 \
            -D "$headers_file" -o "$response_file" \
            -H 'Origin: https://linuxterminal.me' \
            -H 'Range: bytes=0-0' \
            'https://linuxterminal-iso.dshyleshkarthik7.workers.dev/?image=linux4&chunkStart=0&chunkEnd=0'
          grep -qi '^HTTP/.* 206' "$headers_file"
          grep -qi '^Content-Range: bytes 0-0/' "$headers_file"
          grep -qi '^Content-Length: 1' "$headers_file"
          grep -qi '^X-LinuxLab-Worker-Protocol: 7' "$headers_file"
          grep -qi '^X-LinuxLab-Chunk-Start: 0' "$headers_file"
          grep -qi '^X-LinuxLab-Chunk-End: 0' "$headers_file"
          grep -qi '^X-LinuxLab-Chunk-Total: 7731200' "$headers_file"
          grep -qi '^X-LinuxLab-SHA256: a8ea434ab3b177c55f01275dcc1d35f52cfbee9bd44a32e74765c975b58bcc73' "$headers_file"
          test "$(wc -c < "$response_file" | tr -d ' ')" = 1
