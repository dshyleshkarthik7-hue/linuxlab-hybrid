name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
      NPM_CONFIG_FETCH_RETRIES: 8
      NPM_CONFIG_FETCH_RETRY_MINTIMEOUT: 1000
      NPM_CONFIG_FETCH_RETRY_MAXTIMEOUT: 30000
      NPM_CONFIG_FETCH_TIMEOUT: 120000
      NPM_CONFIG_MAXSOCKETS: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - name: Historical secret scan
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_ENABLE_COMMENTS: 'false'
      - name: Verify committed npm lockfile
        run: |
          set -euo pipefail
          npm config set registry "$NPM_CONFIG_REGISTRY"
          npm cache verify
          npm ci --ignore-scripts --prefer-online
      - run: npm audit --audit-level=high
      - run: npm run lint
      - name: Install Playwright Chromium
        run: |
          set -euo pipefail
          test -f node_modules/playwright/cli.js
          node node_modules/playwright/cli.js install --with-deps chromium
      - run: npm run test:ci
      - run: npm run test:smoke
      - name: Real guest isolation gate
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run test:real-guest
      - run: npm run test:mobile
      - run: node tests/p2-p3-contract.test.mjs
      - name: Production smoke (post-deployment only)
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          PRODUCTION_BASE_URL: ${{ vars.PRODUCTION_BASE_URL || 'https://linuxterminal.me' }}
          PRODUCTION_SMOKE_TIMEOUT_MS: 30000
        run: npm run test:production
