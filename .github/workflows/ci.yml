name: CI
on:
  push: {branches: [main]}
  pull_request:
permissions: {contents: read}
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: {node-version: 22, cache: npm}
      - run: npm ci --no-audit --no-fund
      - run: npm run test
      - run: npm run build
      - name: Verify emulator TypeScript source
        run: |
          ! grep -q 'private screenMode' src/main-v86.ts
          grep -q 'btn-v86-terminal' index-v86.html
          grep -q 'btn-v86-screen' index-v86.html
          ! grep -q 'btn-v86-gcc' index-v86.html
      - name: Production build smoke test
        run: |
          set -e
          test -f dist/index.html
          test -f dist/index-v86.html
          grep -Fq 'LinuxTerminal' dist/index.html
          grep -Fq 'btn-v86-alpine' dist/index-v86.html
          grep -Fq 'btn-v86-terminal' dist/index-v86.html
          grep -Fq 'btn-v86-screen' dist/index-v86.html
          ! grep -Fq "from 'v86'" src/main-v86.ts
          grep -Fq "wasm_path:'/v86.wasm'" src/main-v86.ts
          grep -Fq "bios:{url:'/seabios.bin'}" src/main-v86.ts
          grep -Fq "vga_bios:{url:'/vgabios.bin'}" src/main-v86.ts
          grep -Fq "script.src='/libv86.js'" src/main-v86.ts
          ! grep -Fq 'copy.sh/v86/build/libv86.js' src/main-v86.ts
          node -e "const p=require('./package.json'); const l=require('./package-lock.json'); if(p.dependencies.v86!==l.packages[''].dependencies.v86) process.exit(1)"
          echo "Production build smoke test passed"
