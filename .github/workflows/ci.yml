name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
      NPM_CONFIG_FETCH_RETRIES: 8
      NPM_CONFIG_FETCH_RETRY_MINTIMEOUT: 1000
      NPM_CONFIG_FETCH_RETRY_MAXTIMEOUT: 30000
      NPM_CONFIG_FETCH_TIMEOUT: 120000
      NPM_CONFIG_MAXSOCKETS: 1
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          lfs: true
      - name: Verify required LFS firmware assets
        run: |
          set -euo pipefail
          for entry in "public/seabios.bin:131072" "public/vgabios.bin:36352"; do
            path="${entry%%:*}"
            expected="${entry##*:}"
            if [[ ! -f "$path" ]]; then
              echo "ERROR: missing required firmware asset: $path" >&2
              echo "Ensure the real binary is present in Git LFS storage." >&2
              exit 1
            fi
            if head -c 64 "$path" | grep -q '^version https://git-lfs.github.com/spec/v1$'; then
              echo "ERROR: $path is still an LFS pointer after checkout." >&2
              echo "The repository LFS object is missing or checkout could not download it." >&2
              exit 1
            fi
            actual=$(wc -c < "$path")
            if [[ "$actual" != "$expected" ]]; then
              echo "ERROR: $path has $actual bytes; expected $expected bytes." >&2
              exit 1
            fi
          done
          echo "v86 firmware assets verified."
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - name: Verify committed npm lockfile
        run: |
          set -euo pipefail
          npm config set registry "$NPM_CONFIG_REGISTRY"
          npm cache verify
          if npm ci --ignore-scripts --prefer-online; then
            exit 0
          fi
          echo "npm ci failed; retrying once through a separate read-only registry mirror"
          npm cache clean --force
          npm ci --ignore-scripts --prefer-online --registry=https://registry.npmmirror.com --replace-registry-host=always
      - run: npm audit --audit-level=high
      - name: Install Playwright Chromium
        run: |
          set -euo pipefail
          test -f node_modules/playwright/cli.js
          node node_modules/playwright/cli.js install --with-deps chromium
      - run: npm run test:ci
      - run: npm run test:smoke
      - name: Real guest isolation gate
        run: npm run test:real-guest
      - run: npm run test:mobile
      - run: node tests/p2-p3-contract.test.mjs
      - name: Production smoke
        if: ${{ vars.PRODUCTION_BASE_URL != '' }}
        env:
          PRODUCTION_BASE_URL: ${{ vars.PRODUCTION_BASE_URL }}
        run: npm run test:production
