name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      # The repository currently keeps a legacy lockfile while package metadata
      # evolves. npm install refreshes it deterministically in CI without
      # blocking learners on an out-of-sync lockfile.
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Type-check and production build
        run: npm run build
