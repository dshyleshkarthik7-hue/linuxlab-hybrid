name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      preview_base_url:
        description: 'Netlify Preview URL to smoke-test (for example https://deploy-preview-123--linuxterminal.netlify.app)'
        required: false
        type: string
      run_production_smoke:
        description: 'Run production smoke only after explicit approval'
        required: false
        default: false
        type: boolean
  schedule:
    - cron: '17 3 * * *'
permissions:
  contents: read
concurrency:
  group: linuxlab-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  verify:
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
      NPM_CONFIG_FETCH_RETRIES: 8
      NPM_CONFIG_FETCH_RETRY_MINTIMEOUT: 1000
      NPM_CONFIG_FETCH_RETRY_MAXTIMEOUT: 30000
      NPM_CONFIG_FETCH_TIMEOUT: 120000
      NPM_CONFIG_MAXSOCKETS: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          lfs: true
      - name: Hydrate and verify Git LFS assets
        run: |
          set -euo pipefail
          git lfs install --local
          git lfs pull
          node scripts/check-lfs-assets.mjs --iso
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Historical secret scan
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_ENABLE_COMMENTS: 'false'
      - name: Verify committed npm lockfile
        run: |
          set -euo pipefail
          npm config set registry "$NPM_CONFIG_REGISTRY"
          npm cache verify
          npm ci --ignore-scripts --prefer-offline
      - name: Load trusted ISO worker endpoint from runtime config
        run: |
          node --input-type=module -e "import config from './config/runtime.json' with { type: 'json' }; console.log('ISO_BASE_URL=' + config.isoWorkerOrigin)" >> "$GITHUB_ENV"
      - name: Verify required build and test packages
        run: node -e "for (const p of ['vite','typescript','playwright','monaco-editor','@xterm/xterm','@xterm/addon-fit']) { const f = require.resolve(p); if (!f) process.exit(1); console.log('verified', p, f); }"
      - run: npm audit --audit-level=high
      - name: Write dependency audit artifact
        if: always()
        run: npm audit --json > dependency-audit.json || true
      - name: Upload dependency audit artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dependency-audit-${{ github.sha }}
          path: dependency-audit.json
      - run: npm run lint
      - name: Type-check Netlify backend and edge functions
        run: npm run typecheck:server
      - name: Verify ISO builder scripts
        run: |
          set -euo pipefail
          bash -n iso-builder/build-linuxlab-gcc.sh
          node tests/iso-builder-contract.test.mjs
      - name: Install Playwright browser matrix
        run: |
          set -euo pipefail
          test -f node_modules/playwright/cli.js
          node node_modules/playwright/cli.js install --with-deps chromium firefox webkit
      - run: npm run test:ci
      - name: Package production build
        run: tar -czf linuxlab-dist-${GITHUB_SHA}.tar.gz dist
      - name: Upload tested production build for provenance
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linuxlab-dist-${{ github.sha }}
          path: linuxlab-dist-${{ github.sha }}.tar.gz
          if-no-files-found: error
      - name: Upload SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-${{ github.sha }}
          path: sbom.cdx.json
      - run: npm run test:smoke
      - name: Install pinned axe-core for accessibility audit
        run: npm install --no-save --ignore-scripts --no-audit --no-fund axe-core@4.10.3
      - name: Cross-browser accessibility smoke matrix
        run: |
          set -euo pipefail
          for browser in chromium firefox webkit; do
            echo "Accessibility smoke: $browser"
            A11Y_BROWSER="$browser" npm run test:accessibility
            echo "axe-core WCAG audit: $browser"
            A11Y_BROWSER="$browser" npm run test:accessibility:axe
          done
      - name: Real guest isolation gate
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REAL_GUEST_BROWSERS: chromium,firefox,webkit
        run: npm run test:real-guest
      - run: npm run test:mobile
      - run: node tests/p2-p3-contract.test.mjs
      - run: node tests/artifact-manifest.test.mjs
      - run: node tests/github-actions-pinning.test.mjs
      - name: Verify Cloudflare worker contract
        run: npm run test:iso-worker
      - name: Preview smoke (optional Netlify Preview gate)
        if: github.event_name == 'workflow_dispatch' && inputs.preview_base_url != ''
        env:
          PREVIEW_BASE_URL: ${{ inputs.preview_base_url }}
          EXPECTED_DEPLOY_SHA: ${{ github.sha }}
          PRODUCTION_SMOKE_TIMEOUT_MS: 30000
          PRODUCTION_VM_BOOT_TIMEOUT_MS: 120000
        run: npm run test:preview
      - name: Live release preflight (explicitly approved release gate)
        if: github.event_name == 'workflow_dispatch' && inputs.run_production_smoke == true
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          MONGODB_DB: ${{ secrets.MONGODB_DB }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          CERTIFICATE_SIGNING_KEYS: ${{ secrets.CERTIFICATE_SIGNING_KEYS }}
          CERTIFICATE_SIGNING_KEY_ID: ${{ secrets.CERTIFICATE_SIGNING_KEY_ID }}
          CERTIFICATE_ALLOWED_ORIGINS: ${{ secrets.CERTIFICATE_ALLOWED_ORIGINS }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_MODEL: ${{ secrets.HF_MODEL }}
        run: npm run release:preflight
      - name: Production smoke (explicitly approved release gate)
        if: github.event_name == 'workflow_dispatch' && inputs.run_production_smoke == true
        env:
          PRODUCTION_BASE_URL: https://linuxterminal.me
          EXPECTED_DEPLOY_SHA: ${{ github.sha }}
          PRODUCTION_SMOKE_TIMEOUT_MS: 30000
          PRODUCTION_VM_BOOT_TIMEOUT_MS: 120000
        run: npm run test:production

  provenance:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    permissions:
      contents: read
      id-token: write
      attestations: write
    runs-on: ubuntu-24.04
    steps:
      - name: Download tested build artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linuxlab-dist-${{ github.sha }}
      - name: Generate signed build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ github.workspace }}/linuxlab-dist-${{ github.sha }}.tar.gz
