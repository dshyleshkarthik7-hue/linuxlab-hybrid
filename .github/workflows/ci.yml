name: CI
on:
  push: {branches: [main]}
  pull_request:
permissions: {contents: read}
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: {node-version: 22, cache: npm}
      - run: npm ci --no-audit --no-fund
      - run: npm run test
      - run: npm run build
      - name: Verify emulator TypeScript source
        run: |
          ! grep -q 'private screenMode' src/main-v86.ts
          grep -q 'btn-v86-terminal' index-v86.html
          grep -q 'btn-v86-screen' index-v86.html
      - name: Production smoke test
        run: |
          set -eu
          npm run preview -- --host 127.0.0.1 --port 4173 >/tmp/linuxlab.log 2>&1 &
          PID=$!
          cleanup() { kill "$PID" 2>/dev/null || true; }
          trap cleanup EXIT
          READY=0
          for i in $(seq 1 60); do
            if curl -fsS --connect-timeout 2 http://127.0.0.1:4173/ >/dev/null 2>&1; then
              READY=1
              break
            fi
            if ! kill -0 "$PID" 2>/dev/null; then
              cat /tmp/linuxlab.log
              exit 1
            fi
            sleep 1
          done
          if [ "$READY" -ne 1 ]; then
            cat /tmp/linuxlab.log
            exit 1
          fi
          curl -fsS http://127.0.0.1:4173/ -o /tmp/home.html
          curl -fsS http://127.0.0.1:4173/index-v86.html -o /tmp/index-v86.html
          grep -Fq 'btn-v86-alpine' /tmp/index-v86.html
          grep -Fq 'main-v86' /tmp/index-v86.html
          echo "Production preview smoke test passed"
