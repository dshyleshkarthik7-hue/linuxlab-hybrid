name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Happy-path learning checks
        run: npm run test
      - name: Type-check and production build
        run: npm run build
      - name: Full CI script parity
        run: npm run check
      - name: Verify production entry points
        run: |
          test -f dist/index.html
          test -f dist/simulator.html
          test -f dist/index-v86.html
          test -f dist/libv86.js
          test -f dist/v86.wasm
