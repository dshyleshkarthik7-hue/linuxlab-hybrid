name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
      NPM_CONFIG_FETCH_RETRIES: 8
      NPM_CONFIG_FETCH_RETRY_MINTIMEOUT: 1000
      NPM_CONFIG_FETCH_RETRY_MAXTIMEOUT: 30000
      NPM_CONFIG_FETCH_TIMEOUT: 120000
      NPM_CONFIG_MAXSOCKETS: 1
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - name: Historical secret scan
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_ENABLE_COMMENTS: 'false'
      - name: Verify committed npm lockfile
        run: |
          set -euo pipefail
          npm config set registry "$NPM_CONFIG_REGISTRY"
          npm cache verify
          npm ci --ignore-scripts --prefer-online
      - run: npm audit --audit-level=high
      - run: npm run lint
      - name: Verify ISO builder boot contract
        run: node tests/iso-builder-contract.test.mjs
      - name: Install Playwright browser matrix
        run: |
          set -euo pipefail
          test -f node_modules/playwright/cli.js
          node node_modules/playwright/cli.js install --with-deps chromium firefox webkit
      - run: npm run test:ci
      - run: npm run test:smoke
      - name: Real guest isolation gate
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REAL_GUEST_BROWSERS: chromium,firefox,webkit
        run: npm run test:real-guest
      - run: npm run test:mobile
      - run: node tests/p2-p3-contract.test.mjs
      - run: node tests/artifact-manifest.test.mjs
      - run: node tests/github-actions-pinning.test.mjs
      - name: Production smoke (main deployment gate)
        if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
        env:
          PRODUCTION_BASE_URL: ${{ vars.PRODUCTION_BASE_URL || 'https://linuxterminal.me' }}
          PRODUCTION_SMOKE_TIMEOUT_MS: 30000
          ISO_BASE_URL: https://linuxterminal-iso.dshyleshkarthik7.workers.dev
          EXPECTED_DEPLOY_SHA: ${{ github.sha }}
          PRODUCTION_DEPLOY_WAIT_MS: 180000
        run: npm run test:production
