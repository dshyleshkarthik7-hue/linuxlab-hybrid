name: CI
on:
  push: {branches: [main]}
  pull_request:
permissions: {contents: read}
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: {node-version: 22, cache: npm}
      - run: npm ci --no-audit --no-fund
      - run: npm run test
      - run: npm run build
      - name: Verify emulator TypeScript source
        run: |
          ! grep -q 'private screenMode' src/main-v86.ts
          grep -q 'btn-v86-terminal' index-v86.html
          grep -q 'btn-v86-screen' index-v86.html
      - name: Production build smoke test
        run: |
          set -e
          test -f dist/index.html
          test -f dist/index-v86.html
          grep -Fq 'LinuxTerminal' dist/index.html
          grep -Fq 'btn-v86-alpine' dist/index-v86.html
          grep -Fq 'btn-v86-terminal' dist/index-v86.html
          grep -Fq 'btn-v86-screen' dist/index-v86.html
          test -f dist/v86.wasm
          test -f dist/libv86.js
          grep -Fq 'https://copy.sh/v86/build/libv86.js' src/main-v86.ts
          echo "Production build smoke test passed"
