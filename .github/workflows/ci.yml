name: CI
on:
  push: {branches: [main]}
  pull_request:
permissions: {contents: read}
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: {node-version: 22, cache: npm}
      - run: npm ci --no-audit --no-fund
      - run: npm run test
      - run: npm run build
      - name: Verify emulator TypeScript source
        run: |
          ! grep -q 'private screenMode' src/main-v86.ts
          grep -q 'btn-v86-terminal' index-v86.html
          grep -q 'btn-v86-screen' index-v86.html
      - name: Production smoke test
        run: |
          nohup npm run preview -- --host 0.0.0.0 --port 4173 >/tmp/linuxlab.log 2>&1 < /dev/null &
          PID=$!
          trap 'kill $PID 2>/dev/null || true; cat /tmp/linuxlab.log' EXIT
          READY=0
          sleep 2
          for i in {1..60}; do
            if ! kill -0 "$PID" 2>/dev/null; then
              echo "Vite preview exited unexpectedly"; cat /tmp/linuxlab.log; exit 1
            fi
            if curl -fsS --connect-timeout 2 http://localhost:4173/ >/dev/null; then READY=1; break; fi
            sleep 1
          done
          if [ "$READY" -ne 1 ]; then
            echo "Vite preview did not become reachable"
            cat /tmp/linuxlab.log
            exit 1
          fi
          # Verify only files Vite actually serves from the production build.
          for path in / /index-v86.html /libv86.js /v86.wasm /seabios.bin /vgabios.bin; do
            curl -fsS --connect-timeout 5 "http://localhost:4173$path" >/dev/null
          done
          # Avoid pipefail/SIGPIPE ambiguity and report missing markers clearly.
          curl -fsS http://localhost:4173/index-v86.html -o /tmp/index-v86.html
          grep -Fq 'btn-v86-alpine' /tmp/index-v86.html
          grep -Fq 'main-v86' /tmp/index-v86.html
          echo "Production preview smoke test passed"
