name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
      NPM_CONFIG_FETCH_RETRIES: 8
      NPM_CONFIG_FETCH_RETRY_MINTIMEOUT: 1000
      NPM_CONFIG_FETCH_RETRY_MAXTIMEOUT: 30000
      NPM_CONFIG_FETCH_TIMEOUT: 120000
      NPM_CONFIG_MAXSOCKETS: 1
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - name: Verify committed npm lockfile
        run: |
          set -euo pipefail
          npm config set registry "$NPM_CONFIG_REGISTRY"
          npm cache verify
          npm ci --ignore-scripts --prefer-online
      - run: npm audit --audit-level=high
      - name: Install Playwright Chromium
        run: |
          set -euo pipefail
          test -f node_modules/playwright/cli.js
          node node_modules/playwright/cli.js install --with-deps chromium
      - run: npm run test:ci
      - run: npm run test:smoke
      - name: Real guest isolation gate
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run test:real-guest
      - run: npm run test:mobile
      - run: node tests/p2-p3-contract.test.mjs
      - name: Production smoke
        if: ${{ vars.PRODUCTION_BASE_URL != '' }}
        env:
          PRODUCTION_BASE_URL: ${{ vars.PRODUCTION_BASE_URL }}
        run: npm run test:production
