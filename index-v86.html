  <script type="application/ld+json">{"@context":"https://schema.org","@type":"SoftwareApplication","name":"LinuxTerminal","applicationCategory":"DeveloperApplication","operatingSystem":"Web","url":"https://linuxterminal.me/real-linux/","description":"Boot and use Alpine Linux in your browser with LinuxTerminal's x86 emulator powered by WebAssembly and v86."}</script>
</head>
<body>
<div id="app">
  <header class="app-header">
    <div class="logo-group">
      <span style="font-size:1.3rem;">🖥️</span>
      <span class="logo-title">LinuxTerminal <span class="badge" style="color:#4ade80;border-color:#4ade80;">REAL • x86 Emulator</span></span>
    </div>
    <div class="header-actions" id="v86-controls">
      <span id="v86-status" class="action-btn" style="cursor:default;user-select:none;" aria-live="polite">starting…</span>
      <span id="v86-monitor" class="action-btn" style="cursor:default;user-select:none;" aria-live="polite">Loading profile…</span>
      <button id="btn-v86-alpine" class="action-btn" type="button">🐧 Developer Alpine (1 GB)</button>
      <button id="btn-v86-gcc" class="action-btn" type="button">⚙ GCC</button>
      <button id="btn-v86-network" class="action-btn" type="button" aria-pressed="false">🌐 Network: OFF</button>
      <button id="btn-v86-fallback" class="action-btn" type="button">⚡ Compatibility Linux (1 GB)</button>
      <button id="btn-v86-restart" class="action-btn" type="button">↺ Reboot VM</button>
      <a href="/" class="action-btn" style="text-decoration:none;">🏠 Home</a>
    </div>
  </header>

  <main style="display:flex;flex:1;height:calc(100vh - 55px);min-height:0;background:#020617;position:relative;overflow:hidden;">
    <div id="v86-terminal-container" style="flex:1;width:100%;height:100%;min-width:0;min-height:0;padding:12px;position:relative;z-index:1;"></div>
    <div id="screen_container" aria-hidden="true" style="position:absolute;left:-10000px;top:-10000px;width:640px;height:400px;visibility:hidden;pointer-events:none;overflow:hidden;">
      <div style="white-space:pre;font:14px monospace;line-height:14px;"></div><canvas></canvas>
    </div>
  <div id="mobile-linux-keyboard" aria-label="LinuxTerminal mobile keyboard"></div></main>
</div>

<style>#mobile-linux-keyboard{display:none;position:fixed;bottom:0;left:0;right:0;padding:8px;background:rgba(2,6,23,.72);backdrop-filter:blur(12px);z-index:99;gap:5px;flex-wrap:wrap}#mobile-linux-keyboard button{min-width:38px;min-height:38px;border:1px solid #334155;border-radius:8px;background:rgba(15,23,42,.72);color:#e2e8f0}@media(max-width:700px){#mobile-linux-keyboard{display:flex}#v86-terminal-container{padding-bottom:230px!important}}</style><script type="module">
  import { V86LinuxTerminal } from './src/main-v86.ts';

  // Keep startup simple. main-v86 owns the v86 lifecycle and configures the
  // CD-ROM as asynchronous; do not wrap V86Starter or call run() ourselves.
  // A second run() call can race v86's internal initialization and produce
  // "Cannot read properties of undefined (reading 'run')".
  window.addEventListener('DOMContentLoaded', async () => {
    try {
      const vm = new V86LinuxTerminal('v86-terminal-container');
      window.linuxLabVM = vm;
      await vm.bootAlpine(false);
    } catch (error) {
      console.error('[LinuxTerminal] Engine B startup failed:', error);
      const status = document.getElementById('v86-status');
      if (status) status.textContent = 'Alpine emulator failed to start';
    }
  const kb=document.getElementById("mobile-linux-keyboard"); const keys=["ESC","CTRL","ALT","TAB","↑","↓","←","→","/","-","_","|","~","Q","W","E","R","T","Y","U","I","O","P","A","S","D","F","G","H","J","K","L","Z","X","C","V","B","N","M","⌫","SPACE","ENTER"]; let sticky=null; keys.forEach(k=>{const b=document.createElement("button");b.textContent=k;b.onclick=()=>{if(k==="CTRL"||k==="ALT"){sticky=sticky===k?null:k;b.style.outline=sticky===k?"2px solid #38bdf8":"";return;}let data=k==="ESC"?"\x1b":k==="TAB"?"\t":k==="ENTER"?"\r":k==="SPACE"?" ":k==="⌫"?"\x7f":k; if(sticky&&data.length===1){data=String.fromCharCode(data.toLowerCase().charCodeAt(0)-96);sticky=null;document.querySelectorAll("#mobile-linux-keyboard button").forEach(x=>x.style.outline="");} vm.sendMobileInput?.(data);};kb.appendChild(b);});
  });
</script>
</body>
</html>
