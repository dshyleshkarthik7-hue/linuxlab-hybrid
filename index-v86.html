<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Free online Linux terminal emulator: boot real Alpine Linux in your browser, practice Linux commands, and learn safely without installation.">
  <meta name="robots" content="index,follow">
  <meta property="og:title" content="Online Linux Terminal Emulator | LinuxTerminal">
  <meta property="og:description" content="Boot Alpine Linux in your browser and practice real Linux commands.">
  <meta property="og:type" content="website">
  <title>Online Linux Terminal Emulator — Real Alpine in Browser | LinuxTerminal</title>
  <link rel="canonical" href="https://linuxterminal.me/real-linux/">
</head>
<body>
  <div id="app">
    <header class="app-header">
      <div class="logo-group"><span>🖥️</span><span class="logo-title">LinuxTerminal <span class="badge">REAL • x86</span></span></div>
      <div class="header-actions">
        <span id="v86-status" class="action-btn" aria-live="polite">Starting…</span>
        <span id="v86-monitor" class="action-btn" aria-live="polite">Preparing…</span><button id="btn-v86-diagnostics" class="action-btn" type="button">📈 Diagnostics</button><button id="btn-v86-terminal" class="action-btn" type="button">⌨ Terminal</button><button id="btn-v86-screen" class="action-btn" type="button">🖥 Screen</button>
        <button id="btn-v86-alpine" class="action-btn" type="button">🐧 Developer Alpine</button>
        <button id="btn-v86-virt" class="action-btn" type="button">⚡ Alpine Virt 3.24 • x86_64 incompatible</button>
        
        <button id="btn-v86-restart" class="action-btn" type="button">↺ Reboot</button><button id="btn-v86-copydiag" class="action-btn" type="button">📋 Copy diagnostics</button>
        <a href="/" class="action-btn">🏠 Home</a>
      </div>
    </header>
    <main id="vm-main">
      <div id="v86-terminal-container"></div>
      <div id="screen_container" hidden><div></div><canvas></canvas></div><div id="v86-diagnostics" hidden aria-live="polite"></div>
    </main>
  </div>
  <style>
    html,body,#app{margin:0;width:100%;height:100%;background:#020617}
    #vm-main{height:calc(100vh - 72px);min-height:320px;position:relative}
    #v86-terminal-container{position:absolute;inset:0;padding:12px;box-sizing:border-box;min-width:0;min-height:0;z-index:2;pointer-events:auto}.xterm{pointer-events:auto}
    #screen_container{position:absolute;inset:12px;z-index:1;display:flex;align-items:center;justify-content:center;overflow:auto;background:#000}#screen_container canvas{max-width:100%;max-height:100%;image-rendering:auto}
    .header-actions{display:flex;gap:6px;flex-wrap:wrap;align-items:center}#v86-diagnostics{position:absolute;right:20px;bottom:20px;z-index:5;max-width:min(420px,90vw);padding:14px;border:1px solid #38bdf8;border-radius:10px;background:rgba(2,6,23,.95);color:#e2e8f0;font:12px ui-monospace,monospace;white-space:pre-wrap;box-shadow:0 12px 40px rgba(0,0,0,.45)}
    @media(max-width:700px){#vm-main{height:calc(100vh - 170px)}}
  </style>
  <script type="module" src="/src/main-v86.ts"></script>
</body>
</html>
