<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <meta
      name="description"
      content="LinuxLab Engine B — browser x86 Linux emulator"
    />

    <title>
      LinuxLab — Dual-Reality x86 Linux Lab
    </title>

    <link
      rel="stylesheet"
      href="/src/style.css"
    />
  </head>

  <body>
    <div id="app">

      <!-- =========================================================
           HEADER
           ========================================================= -->

      <header class="app-header">

        <div class="logo-group">

          <span
            style="font-size:1.3rem;"
          >
            🖥️
          </span>

          <span class="logo-title">

            LinuxLab

            <span
              class="badge"
              style="
                color:#4ade80;
                border-color:#4ade80;
              "
            >
              Engine B • x86 Hardware Emulator
            </span>

          </span>

        </div>


        <!-- =======================================================
             CONTROLS
             ======================================================= -->

        <div
          class="header-actions"
          id="v86-controls"
        >

          <span
            id="v86-status"
            class="action-btn"
            style="
              cursor:default;
              user-select:none;
            "
            aria-live="polite"
          >
            starting…
          </span>


          <button
            id="btn-v86-alpine"
            class="action-btn"
            type="button"
          >
            🐧 Boot Alpine
          </button>


          <button
            id="btn-v86-gcc"
            class="action-btn"
            type="button"
          >
            ⚙ GCC
          </button>


          <button
            id="btn-v86-fallback"
            class="action-btn"
            type="button"
          >
            🛟 Boot linux4
          </button>


          <button
            id="btn-v86-restart"
            class="action-btn"
            type="button"
          >
            ↺ Reboot VM
          </button>


          <a
            href="./index.html"
            class="action-btn"
            style="text-decoration:none;"
          >
            🏠 Home
          </a>

        </div>

      </header>


      <!-- =========================================================
           MAIN
           ========================================================= -->

      <main
        style="
          display:flex;
          flex:1;
          height:calc(100vh - 55px);
          min-height:0;
          background:#020617;
          position:relative;
          overflow:hidden;
        "
      >

        <!-- =======================================================
             XTERM TERMINAL
             ======================================================= -->

        <div
          id="v86-terminal-container"
          style="
            flex:1;
            width:100%;
            height:100%;
            min-width:0;
            min-height:0;
            padding:12px;
            position:relative;
            z-index:1;
          "
        ></div>


        <!-- =======================================================
             V86 SCREEN CONTAINER
             
             v86 needs this element mounted in the DOM.
             It is deliberately placed off-screen so the xterm
             terminal remains the visible interface.
             ======================================================= -->

        <div
          id="screen_container"
          aria-hidden="true"
          style="
            position:absolute;
            left:-10000px;
            top:-10000px;

            width:640px;
            height:400px;

            visibility:hidden;

            pointer-events:none;

            overflow:hidden;
          "
        >

          <div
            style="
              white-space:pre;
              font:14px monospace;
              line-height:14px;
            "
          ></div>

          <canvas></canvas>

        </div>

      </main>

    </div>


    <!-- ===========================================================
         ENGINE B
         =========================================================== -->

    <script type="module">
      import { V86LinuxTerminal } from './src/main-v86.ts';

      window.addEventListener('DOMContentLoaded', async () => {
        const vm = new V86LinuxTerminal('v86-terminal-container');
        window.linuxLabVM = vm;

        try {
          await vm.bootAlpine();
        } catch (error) {
          console.error('[LinuxLab] Engine B startup failed:', error);
        }
      });
    </script>

  </body>
</html>
