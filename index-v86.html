<body>
<div id="app">
  <header class="app-header">
    <div class="logo-group">
      <span style="font-size:1.3rem;">🖥️</span>
      <span class="logo-title">LinuxLab <span class="badge" style="color:#4ade80;border-color:#4ade80;">REAL • x86 Emulator</span></span>
    </div>
    <div class="header-actions" id="v86-controls">
      <span id="v86-status" class="action-btn" style="cursor:default;user-select:none;" aria-live="polite">starting…</span>
      <span id="v86-monitor" class="action-btn" style="cursor:default;user-select:none;" aria-live="polite">RAM: 512 MiB • Network: off</span>
      <button id="btn-v86-alpine" class="action-btn" type="button">🐧 Boot Alpine</button>
      <button id="btn-v86-gcc" class="action-btn" type="button">⚙ GCC</button>
      <button id="btn-v86-fallback" class="action-btn" type="button">🛟 Boot linux4</button>
      <button id="btn-v86-restart" class="action-btn" type="button">↺ Reboot VM</button>
      <a href="./index.html" class="action-btn" style="text-decoration:none;">🏠 Home</a>
    </div>
  </header>

  <main style="display:flex;flex:1;height:calc(100vh - 55px);min-height:0;background:#020617;position:relative;overflow:hidden;">
    <div id="v86-terminal-container" style="flex:1;width:100%;height:100%;min-width:0;min-height:0;padding:12px;position:relative;z-index:1;"></div>
    <div id="screen_container" aria-hidden="true" style="position:absolute;left:-10000px;top:-10000px;width:640px;height:400px;visibility:hidden;pointer-events:none;overflow:hidden;">
      <div style="white-space:pre;font:14px monospace;line-height:14px;"></div><canvas></canvas>
    </div>
  </main>
</div>

<script type="module">
  import { V86LinuxTerminal } from './src/main-v86.ts';

  // Keep startup simple. main-v86 owns the v86 lifecycle and configures the
  // CD-ROM as asynchronous; do not wrap V86Starter or call run() ourselves.
  // A second run() call can race v86's internal initialization and produce
  // "Cannot read properties of undefined (reading 'run')".
  window.addEventListener('DOMContentLoaded', async () => {
    try {
      const vm = new V86LinuxTerminal('v86-terminal-container');
      window.linuxLabVM = vm;
      await vm.bootAlpine();
    } catch (error) {
      console.error('[LinuxLab] Engine B startup failed:', error);
      const status = document.getElementById('v86-status');
      if (status) status.textContent = 'Alpine emulator failed to start';
    }
  });
</script>
</body>
