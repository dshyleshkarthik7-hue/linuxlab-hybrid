<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>100 Linux Challenges — LinuxTerminal</title><meta name="description" content="Complete 100 practical Linux challenges with commands, files, text processing, system concepts and safe browser practice."><meta name="keywords" content="Linux challenges,Linux practice challenges,learn Linux,LinuxTerminal"><meta name="author" content="Shylesh Karthik Dinavahi"><meta name="robots" content="index,follow,max-image-preview:large"><link rel="canonical" href="https://linuxterminal.me/challenges/"><meta property="og:title" content="100 Linux Challenges | LinuxTerminal"><meta property="og:description" content="Practice Linux with 100 deterministic, checkable challenges."><meta property="og:type" content="website"><meta property="og:url" content="https://linuxterminal.me/challenges/"><style>body{margin:0;background:#061426;color:#e8f1ff;font:16px/1.6 system-ui,sans-serif}main{max-width:980px;margin:auto;padding:24px 18px 70px}a{color:#43d9ff}.card{background:#0d2038;border:1px solid #24486e;border-radius:18px;padding:22px;margin:16px 0}.challenge{padding:16px;border-top:1px solid #24486e}.challenge:first-child{border-top:0}.tag{display:inline-block;padding:3px 8px;border-radius:999px;background:#102d4b;color:#9fdcff;font-size:12px}code,pre{background:#020914;border-radius:7px;padding:2px 5px}pre{padding:12px;overflow:auto}.done{color:#4ade80}.btn{border:0;border-radius:10px;background:#1677ff;color:white;padding:9px 13px;font-weight:800;cursor:pointer}</style></head><body><main><nav><a href="/">>_ LinuxTerminal</a> · <a href="/commands/">50 command pages</a> · <a href="/quiz/">500 quiz</a> · <a href="/about/">About</a></nav><h1>100 Linux challenges</h1><p>Each core command has two challenges: a direct task and a reasoning task. The challenges are safe to practice in the browser simulator; network examples are explicitly demonstrations.</p><section id="list" class="card"></section></main><script>
const commands=" + cmd_json + ";
const list=document.getElementById('list');
let completed=JSON.parse(localStorage.getItem('linuxterminal-challenges')||'[]');
commands.forEach((c,i)=>{
 const items=[`Practice <code>${esc(c.example)}</code>. Predict stdout/stderr and exit status before running it.`,`Change one argument in <code>${esc(c.example)}</code>, explain what should change, then verify the result in the simulator.`];
 items.forEach((task,j)=>{const id=i*2+j+1;const wrap=document.createElement('article');wrap.className='challenge';const checked=completed.includes(id);wrap.innerHTML=`<span class="tag">Challenge ${id} • ${esc(c.category)}</span><h2>${esc(c.name)}: ${j===0?'Execute and inspect':'Change one variable'}</h2><p>${task}</p><button class="btn" type="button">${checked?'✓ Completed':'Mark complete'}</button>`;const b=wrap.querySelector('button');if(checked)b.classList.add('done');b.onclick=()=>{if(completed.includes(id))completed=completed.filter(x=>x!==id);else completed.push(id);localStorage.setItem('linuxterminal-challenges',JSON.stringify(completed));b.textContent=completed.includes(id)?'✓ Completed':'Mark complete';b.classList.toggle('done',completed.includes(id))};list.appendChild(wrap)})});
function esc(s){return s.replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;')}
</script></body></html>
