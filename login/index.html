<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LinuxTerminal.me — Sign in</title><meta name="description" content="Sign in to LinuxTerminal.me with Netlify Identity to use the AI Tutor."><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#061426;color:#eef6ff;font:16px/1.6 system-ui,sans-serif}.card{width:min(92vw,520px);padding:32px;border:1px solid #24486e;border-radius:20px;background:#0d2038;box-shadow:0 25px 70px #0006}.card h1{margin-top:0}.muted{color:#a6bad3}.login{display:inline-block;margin-top:12px;padding:12px 18px;border:0;border-radius:10px;background:#1677ff;color:#fff;font-weight:800;cursor:pointer}.back{color:#43d9ff}.status{margin-top:16px;min-height:1.5em}</style><script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script></head><body><main class="card"><a class="back" href="../">← LinuxTerminal.me</a><h1>Sign in to LinuxTerminal</h1><p class="muted">Use Netlify Identity to sign in or create your free account. Your password is handled by Netlify Identity.</p><button id="login" class="login" type="button">Sign in / Create account</button><p id="status" class="status" role="status">Checking session…</p><p><a class="back" href="../beginner/#tutor">Return to AI Tutor</a></p></main><script>window.addEventListener('DOMContentLoaded',function(){var identity=window.netlifyIdentity;var button=document.getElementById('login');var status=document.getElementById('status');if(!identity){status.textContent='Netlify Identity could not load. Please try again.';return;}identity.on('init',function(user){if(user){status.textContent='Signed in as '+(user.email||user.user_metadata?.full_name||'your account')+'.';button.textContent='Account';}else status.textContent='Not signed in.';});identity.on('login',function(user){status.textContent='Signed in. Returning to Tutor…';setTimeout(function(){location.href='../beginner/#tutor';},300);});identity.on('logout',function(){status.textContent='Signed out.';button.textContent='Sign in / Create account';});identity.on('error',function(){status.textContent='Netlify Identity could not complete that action.';});button.addEventListener('click',function(){if(identity.currentUser())identity.open();else identity.open('login');});});</script></body></html>
