[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  external_node_modules = ["mongodb"]

[build.environment]
  # CERTIFICATE_SIGNING_KEY_ID is a public certificate key identifier, not a signing secret.
  # Keep secret scanning enabled for actual credentials while excluding this identifier value.
  SECRETS_SCAN_OMIT_KEYS = "CERTIFICATE_SIGNING_KEY_ID"

[build]
  publish = "dist"
  command = "npm run build"

[[edge_functions]]
  path = "/api/tutor"
  function = "tutor"
[[edge_functions]]
  path = "/api/careers-jobs"
  function = "careers-jobs"
  cache = "manual"
[[edge_functions]]
  path = "/api/csp-report"
  function = "csp-report"
[[edge_functions]]
  path = "/api/linux4-iso"
  function = "linux4-iso"
  cache = "manual"

[[redirects]]
  from = "/commands"
  to = "/commands-entry.html"
  status = 200
[[redirects]]
  from = "/commands/"
  to = "/commands-entry.html"
  status = 200


[[redirects]]
  from = "/learn"
  to = "/learn/index.html"
  status = 200
[[redirects]]
  from = "/learn/"
  to = "/learn/index.html"
  status = 200
[[redirects]]
  from = "/tutorials"
  to = "/learn/index.html"
  status = 200
[[redirects]]
  from = "/tutorials/"
  to = "/learn/index.html"
  status = 200
[[redirects]]
  from = "/progress"
  to = "/progress/index.html"
  status = 200
[[redirects]]
  from = "/progress/"
  to = "/progress/index.html"
  status = 200
[[redirects]]
  from = "/certificate"
  to = "/certificate/"
  status = 301
[[redirects]]
  from = "/certification"
  to = "/certificate/"
  status = 301
[[redirects]]
  from = "/certification/"
  to = "/certificate/"
  status = 301
[[redirects]]
  from = "/real-linux/"
  to = "/index-v86.html"
  status = 200
[[redirects]]
  from = "/simulator/"
  to = "/simulator.html"
  status = 200
[[redirects]]
  from = "/developer-alpine/"
  to = "/developer-alpine/index.html"
  status = 200
[[redirects]]
  from = "/linux-careers/"
  to = "/linux-careers.html"
  status = 200

