[build]
  publish = "dist"
  command = "sed -i \"s|CLOUDFLARE_INSIGHTS_SCRIPT_ORIGIN|\${CLOUDFLARE_INSIGHTS_SCRIPT_ORIGIN:?Set CLOUDFLARE_INSIGHTS_SCRIPT_ORIGIN in Netlify}|g; s|CLOUDFLARE_INSIGHTS_CONNECT_ORIGIN|\${CLOUDFLARE_INSIGHTS_CONNECT_ORIGIN:?Set CLOUDFLARE_INSIGHTS_CONNECT_ORIGIN in Netlify}|g\" netlify.toml && npm run build"

[[edge_functions]]
  path = "/api/tutor"
  function = "tutor"
[[edge_functions]]
  path = "/api/certificate"
  function = "certificate-rate-limit"
[[edge_functions]]
  path = "/api/csp-report"
  function = "csp-report"
[[edge_functions]]
  path = "/api/v86-firmware/*"
  function = "v86-firmware"

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' CLOUDFLARE_INSIGHTS_SCRIPT_ORIGIN https://netlify-rum.netlify.app; style-src 'self'; connect-src 'self' https://linuxterminal.me https://www.linuxterminal.me CLOUDFLARE_INSIGHTS_CONNECT_ORIGIN; img-src 'self' data:; font-src 'self' data:; worker-src 'self' blob:; child-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'; report-uri /api/csp-report"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Embedder-Policy = "credentialless"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

[[headers]]
  for = "/login/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://identity.netlify.com https://netlify-rum.netlify.app; style-src 'self'; connect-src 'self' https://identity.netlify.com; img-src 'self' data: https://identity.netlify.com; font-src 'self' data:; worker-src 'self' blob:; child-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'; report-uri /api/csp-report"

[[headers]]
  for = "/beginner/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://identity.netlify.com; style-src 'self' 'unsafe-inline'; connect-src 'self' https://identity.netlify.com; img-src 'self' data: https://identity.netlify.com; font-src 'self' data:; worker-src 'self' blob:; child-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'; report-uri /api/csp-report"

[[headers]]
  for = "/real-linux/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' CLOUDFLARE_INSIGHTS_SCRIPT_ORIGIN https://netlify-rum.netlify.app; style-src 'self' 'unsafe-inline'; connect-src 'self' https://linuxterminal.me https://www.linuxterminal.me CLOUDFLARE_INSIGHTS_CONNECT_ORIGIN; img-src 'self' data:; font-src 'self' data:; worker-src 'self' blob:; child-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'; report-uri /api/csp-report"

[[headers]]
  for = "/developer-alpine/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' CLOUDFLARE_INSIGHTS_SCRIPT_ORIGIN https://netlify-rum.netlify.app; style-src 'self' 'unsafe-inline'; connect-src 'self' https://linuxterminal.me https://www.linuxterminal.me CLOUDFLARE_INSIGHTS_CONNECT_ORIGIN; img-src 'self' data:; font-src 'self'; worker-src 'self' blob:; child-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'; report-uri /api/csp-report"

[[redirects]]
