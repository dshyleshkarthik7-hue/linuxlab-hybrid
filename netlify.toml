[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  external_node_modules = ["mongodb"]

[build.environment]
  # CERTIFICATE_SIGNING_KEY_ID is a public certificate key identifier, not a signing secret.
  # Keep secret scanning enabled for actual credentials while excluding this identifier value.
  SECRETS_SCAN_OMIT_KEYS = "CERTIFICATE_SIGNING_KEY_ID"

[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Resource-Policy = "same-origin"

[build]
  publish = "dist"
  command = "npm run build && node scripts/write-build-info.mjs"

[[edge_functions]]
  path = "/api/tutor"
  function = "tutor"
[[edge_functions]]
  path = "/api/csp-report"
  function = "csp-report"
[[edge_functions]]
  path = "/api/v86-firmware/*"
  function = "v86-firmware"
[[edge_functions]]
  path = "/api/iso/linux4"
  function = "linux4-iso"
  cache = "manual"

[[redirects]]
  from = "/commands"
  to = "/commands-entry.html"
  status = 200
[[redirects]]
  from = "/commands/"
  to = "/commands-entry.html"
  status = 200


