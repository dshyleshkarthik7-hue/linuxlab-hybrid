<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>500 Linux Quiz Questions — LinuxTerminal</title><meta name="description" content="Practice 500 Linux command quiz questions across 50 core commands with immediate feedback."><meta name="keywords" content="500 Linux quiz questions,Linux command quiz,learn Linux,LinuxTerminal"><meta name="author" content="Shylesh Karthik Dinavahi"><meta name="robots" content="index,follow,max-image-preview:large"><link rel="canonical" href="https://linuxterminal.me/quiz/"><meta property="og:type" content="website"><meta property="og:title" content="500 Linux Quiz Questions | LinuxTerminal"><meta property="og:description" content="A 500-question Linux command practice set with immediate feedback."><meta property="og:url" content="https://linuxterminal.me/quiz/"><style>body{margin:0;background:#061426;color:#e8f1ff;font:16px/1.6 system-ui,sans-serif}main{max-width:980px;margin:auto;padding:24px 18px 70px}a{color:#43d9ff}.card{background:#0d2038;border:1px solid #24486e;border-radius:18px;padding:22px;margin:16px 0}.meta{color:#9fb4cf}.option{display:block;width:100%;margin:8px 0;padding:12px;text-align:left;background:#08182b;border:1px solid #315b87;border-radius:10px;color:#e8f1ff;cursor:pointer}.option:hover{border-color:#43d9ff}.correct{border-color:#27c93f;background:#102d24}.wrong{border-color:#ff7b72;background:#321c24}.btn{display:inline-block;border:0;border-radius:10px;background:#1677ff;color:white;padding:11px 16px;font-weight:800;cursor:pointer}.bar{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.score{font-weight:800;color:#43d9ff}</style></head><body><main><nav><a href="/">>_ LinuxTerminal</a> · <a href="/commands/">50 command pages</a> · <a href="/challenges/">100 challenges</a> · <a href="/about/">About</a></nav><header><h1>500 Linux quiz questions</h1><p class="meta">Exactly ten question forms for each of 50 core commands.</p></header><section class="card"><div class="bar"><span id="progress">Question 1 / 500</span><span id="score" class="score">Score: 0</span><button id="reset" class="btn" type="button">Reset quiz</button></div><h2 id="question"></h2><p id="context" class="meta"></p><div id="options"></div><p id="feedback" aria-live="polite"></p><button id="next" class="btn" type="button" hidden>Next question</button></section></main><script>
const commands=['pwd','ls','cd','mkdir','touch','cat','cp','mv','rm','find','echo','printf','grep','head','tail','wc','sort','uniq','sed','awk','chmod','whoami','ps','top','df','du','free','uname','date','env','export','history','clear','man','tar','gzip','zip','ping','curl','ip','ifconfig','ssh','scp','gcc','make','nano','vim','vi','less','cut'];
const questions=[];
const forms=[
 c=>({q:`What is a primary learning goal for \\`${c}\\`?`,a:'understand its syntax, output and exit status'}),
 c=>({q:`Which command should you practice for this question?`,a:c}),
 c=>({q:`What should you inspect after running \\`${c}\\`?`,a:'stdout, stderr and the exit status'}),
 c=>({q:`Where should a beginner safely practice \\`${c}\\` in LinuxTerminal?`,a:'the browser simulator'}),
 c=>({q:`Which option is a good learning method for \\`${c}\\`?`,a:'predict, run, inspect, then explain the result'}),
 c=>({q:`What can a non-zero exit status from \\`${c}\\` indicate?`,a:'the command reported a failure'}),
 c=>({q:`Which workflow is best when learning \\`${c}\\`?`,a:'start with a small example and change one input at a time'}),
 c=>({q:`What should the AI Tutor use to explain a \\`${c}\\` mistake?`,a:'the command, output, error, history and current context'}),
 c=>({q:`What should you avoid assuming about simulator results for \\`${c}\\`?`,a:'that simulated kernel or network behavior is identical to a host Linux system'}),
 c=>({q:`After mastering \\`${c}\\`, what is a useful next step?`,a:'combine it with another command and verify the pipeline or conditional'})
];
for(const c of commands)for(const make of forms){const x=make(c);questions.push({...x,command:c});}
let index=0,score=0,answered=false;
const qEl=document.getElementById('question'),oEl=document.getElementById('options'),fEl=document.getElementById('feedback'),nEl=document.getElementById('next'),pEl=document.getElementById('progress'),sEl=document.getElementById('score'),cEl=document.getElementById('context');
function shuffle(a){return a.sort(()=>Math.random()-.5)}
function render(){answered=false;const x=questions[index];pEl.textContent=`Question ${index+1} / ${questions.length}`;sEl.textContent=`Score: ${score}`;qEl.textContent=x.q;cEl.textContent=`Focus command: ${x.command}`;oEl.replaceChildren();fEl.textContent='';nEl.hidden=true;const pool=[x.a,'stdout, stderr and the exit status','the browser simulator','predict, run, inspect, then explain the result','the command reported a failure','start with a small example and change one input at a time','the command, output, error, history and current context','that simulated kernel or network behavior is identical to a host Linux system','combine it with another command and verify the pipeline or conditional'];const opts=shuffle([x.a,...shuffle([...new Set(pool.filter(v=>v!==x.a))]).slice(0,3)]);for(const opt of opts){const b=document.createElement('button');b.className='option';b.textContent=opt;b.onclick=()=>answer(b,opt,x.a);oEl.appendChild(b)}}
function answer(button,opt,correct){if(answered)return;answered=true;for(const b of oEl.children)b.disabled=true;if(opt===correct){button.classList.add('correct');score++;fEl.textContent='✓ Correct.'}else{button.classList.add('wrong');fEl.textContent=`Not quite. Correct answer: ${correct}`}sEl.textContent=`Score: ${score}`;nEl.hidden=false}
nEl.onclick=()=>{if(index<questions.length-1){index++;render()}else{qEl.textContent='Quiz complete';cEl.textContent='';oEl.replaceChildren();fEl.textContent=`Final score: ${score} / ${questions.length}.`;nEl.hidden=true}};
document.getElementById('reset').onclick=()=>{index=0;score=0;render()};render();
</script></body></html>
