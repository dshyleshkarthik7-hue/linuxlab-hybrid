  <body>
    <div id="app">
      <header class="app-header">
        <div class="logo-group">
          <span style="font-size: 1.3rem;">⚡</span>
          <span class="logo-title">LinuxLab <span class="badge">Learning Sandbox • Simulated</span></span>
        </div>
        <div class="header-actions">
          <button id="btn-run-tests" class="action-btn test-btn">⚡ Check My Code</button>
          <button id="btn-reset" class="action-btn">↺ Reset Learning Session</button>
          <a href="./index.html" class="action-btn" style="text-decoration: none;">🏠 Exit to Home</a>
        </div>
      </header>

      <main class="workspace-container">
        <!-- Left Editor Pane -->
        <section class="editor-pane">
          <div class="pane-header">
            <div class="file-tabs">
              <button id="tab-main-c" class="file-tab active">main.c</button>
              <button id="tab-main-java" class="file-tab">Main.java</button>
            </div>
            <button id="btn-save-fs" class="btn-save">Save Sandbox Files (Ctrl+S)</button>
          </div>
          
          <div id="monaco-container"></div>

          <div id="test-feedback-panel" class="test-feedback">
            <div class="test-header">Learning Feedback</div>
            <div id="test-output-list">Click "Check My Code" to see whether the current exercise passes the learning checks.</div>
          </div>
        </section>

        <!-- Right Terminal Pane -->
        <section class="terminal-pane">
          <div class="pane-header">
            <span id="active-terminal-title" class="terminal-status">Learning Sandbox: Simulated Linux-style Shell</span>
            <span class="terminal-hint">Try: ls, cd, nano main.c, gcc main.c -o table && ./table</span>
          </div>
          <div id="simulator-terminal-container" class="terminal-viewport"></div>
        </section>
      </main>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
